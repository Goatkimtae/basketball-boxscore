name: 웹 앱 판정 규칙 테스트

on:
  push:
    paths:
      - "hoopstat/**"
      - ".github/workflows/web-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Play-flow rules
        run: node --test hoopstat/tests/*.test.js
